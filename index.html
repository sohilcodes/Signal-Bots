<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Trade with AI</title>
    <link rel="stylesheet" href="style.css">
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
</head>
<body>

    <!-- Matrix Rain Canvas -->
    <canvas id="matrix-canvas"></canvas>

    <div id="app">
        <!-- Screen 1 – Pair Selection -->
        <div id="screen1" class="screen active">
            <h1>Trade with AI</h1>
            <div class="card">
                <label for="pair-select">Select Trading Pair</label>
                <select id="pair-select">
                    <option value="">Choose pair...</option>
                    <option value="EUR/USD OTC">EUR/USD OTC</option>
                    <option value="GBP/USD OTC">GBP/USD OTC</option>
                    <option value="AUD/CAD OTC">AUD/CAD OTC</option>
                    <option value="USD/JPY OTC">USD/JPY OTC</option>
                </select>
            </div>
            <button id="next-to-expiry" class="big-btn">Next →</button>
        </div>

        <!-- Screen 2 – Expiry -->
        <div id="screen2" class="screen">
            <h2>Expiry Time</h2>
            <div class="expiry-grid">
                <button class="expiry-btn" data-time="S5">5 sec</button>
                <button class="expiry-btn" data-time="S30">30 sec</button>
                <button class="expiry-btn" data-time="M1">1 min</button>
                <button class="expiry-btn" data-time="M5">5 min</button>
                <button class="expiry-btn" data-time="M15">15 min</button>
                <button class="expiry-btn" data-time="M30">30 min</button>
                <button class="expiry-btn" data-time="H1">1 hour</button>
                <button class="expiry-btn" data-time="H4">4 hours</button>
            </div>
            <button id="next-to-signal" class="big-btn">Continue →</button>
        </div>

        <!-- Screen 3 – Signal -->
        <div id="screen3" class="screen">
            <button id="get-signal" class="big-btn signal-btn">GET SIGNAL</button>

            <div id="processing" class="processing-container">
                <div class="step" id="step1">Technical screening...</div>
                <div class="step" id="step2">Pattern recognition...</div>
                <div class="step" id="step3">Probability & risk calc...</div>
                <div class="step" id="step4">Final validation...</div>
            </div>

            <div id="signal-card" class="signal-card">
                <div class="signal-header">Trading Signal</div>
                <div class="signal-row">
                    <span>Pair:</span>
                    <strong id="signal-pair"></strong>
                </div>
                <div class="signal-row">
                    <span>Expiry:</span>
                    <strong id="signal-time"></strong>
                </div>
                <div class="signal-row direction">
                    <span>Signal:</span>
                    <strong id="signal-direction"></strong>
                </div>
            </div>
        </div>
    </div>

    <script src="script.js"></script>

    <!-- Matrix Rain Script -->
    <script>
        const canvas = document.getElementById('matrix-canvas');
        const ctx = canvas.getContext('2d');

        function resize() {
            canvas.width  = window.innerWidth;
            canvas.height = window.innerHeight;
        }
        resize();

        const fontSize = 14;
        let cols = Math.floor(canvas.width / fontSize);
        let drops = Array(cols).fill(1);

        const chars = '01010110010101001101010011010100110101';

        let animId;

        function drawMatrix() {
            ctx.fillStyle = 'rgba(0, 0, 0, 0.05)';
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            for (let i = 0; i < drops.length; i++) {
                const char = chars[Math.floor(Math.random() * chars.length)];
                const x = i * fontSize;
                const y = drops[i] * fontSize;

                // Brightest at head, fade behind
                if (Math.random() > 0.95) {
                    ctx.fillStyle = '#ffffff';
                } else {
                    ctx.fillStyle = '#00ff41';
                }

                ctx.font = `${fontSize}px 'Courier New', monospace`;
                ctx.fillText(char, x, y);

                if (y > canvas.height && Math.random() > 0.975) {
                    drops[i] = 0;
                }
                drops[i]++;
            }
        }

        function startMatrix() {
            animId = setInterval(drawMatrix, 45);
        }

        startMatrix();

        window.addEventListener('resize', () => {
            clearInterval(animId);
            resize();
            cols = Math.floor(canvas.width / fontSize);
            drops = Array(cols).fill(1);
            startMatrix();
        });

        // Respect prefers-reduced-motion
        if (window.matchMedia('(prefers-reduced-motion: reduce)').matches) {
            clearInterval(animId);
            ctx.fillStyle = '#000';
            ctx.fillRect(0, 0, canvas.width, canvas.height);
        }
    </script>
</body>
</html>
