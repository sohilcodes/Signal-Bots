<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>BenZ Trader – Trade with AI</title>
    <link rel="stylesheet" href="style.css">
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
</head>
<body>

    <!-- Matrix Rain Canvas -->
    <canvas id="matrix-canvas"></canvas>

    <!-- Top Bar -->
    <div id="topbar">
        <img src="logo.jpg" alt="BenZ Trader" id="logo" />
        <span id="topbar-title">BenZ Trader</span>
        <a href="https://t.me/+Hpe1hy7ME_FhM2Yx" target="_blank" id="join-btn">
            ✈️ Join
        </a>
    </div>

    <div id="app">

        <!-- Screen 1 – Pair Selection -->
        <div id="screen1" class="screen active">
            <h1>Trade with <span>AI</span></h1>
            <p class="subtitle">▸ Powered by BenZ Trader ◂</p>

            <div class="divider"></div>

            <!-- Winrate Circle -->
            <div class="winrate-wrapper">
                <p class="winrate-label">Today's Winrate</p>
                <div class="winrate-circle-container">
                    <svg class="winrate-svg" viewBox="0 0 120 120">
                        <!-- Background track -->
                        <circle class="track" cx="60" cy="60" r="50"/>
                        <!-- Animated fill -->
                        <circle class="fill" id="winrate-fill" cx="60" cy="60" r="50"/>
                    </svg>
                    <div class="winrate-text">
                        <span class="winrate-percent" id="winrate-num">0%</span>
                        <span class="winrate-sub">Accuracy</span>
                    </div>
                </div>
            </div>

            <div class="divider"></div>

            <div class="card">
                <label>Select Trading Pair</label>
                <select id="pair-select">
                    <option value="">Choose pair...</option>
                    <option value="EUR/USD OTC">EUR/USD OTC</option>
                    <option value="GBP/USD OTC">GBP/USD OTC</option>
                    <option value="AUD/CAD OTC">AUD/CAD OTC</option>
                    <option value="USD/JPY OTC">USD/JPY OTC</option>
                </select>
            </div>

            <button id="next-to-expiry" class="big-btn">Next →</button>
        </div>

        <!-- Screen 2 – Expiry -->
        <div id="screen2" class="screen">
            <h2>Select Expiry</h2>
            <p class="subtitle">▸ Choose your trade window ◂</p>

            <div class="expiry-grid">
                <button class="expiry-btn" data-time="5 Sec">5 sec</button>
                <button class="expiry-btn" data-time="30 Sec">30 sec</button>
                <button class="expiry-btn" data-time="1 Min">1 min</button>
                <button class="expiry-btn" data-time="5 Min">5 min</button>
                <button class="expiry-btn" data-time="15 Min">15 min</button>
                <button class="expiry-btn" data-time="30 Min">30 min</button>
                <button class="expiry-btn" data-time="1 Hour">1 hour</button>
                <button class="expiry-btn" data-time="4 Hours">4 hours</button>
            </div>

            <button id="next-to-signal" class="big-btn">Continue →</button>
        </div>

        <!-- Screen 3 – Signal -->
        <div id="screen3" class="screen">
            <button id="get-signal" class="big-btn signal-btn">⚡ GET SIGNAL</button>

            <div id="processing" class="processing-container">
                <div class="step" id="step1">Technical screening...</div>
                <div class="step" id="step2">Pattern recognition...</div>
                <div class="step" id="step3">Probability & risk calc...</div>
                <div class="step" id="step4">Final validation...</div>
            </div>

            <div id="signal-card" class="signal-card">
                <div class="signal-header">🎯 Trading Signal Ready</div>
                <div class="signal-body">
                    <div class="signal-row">
                        <span>Pair</span>
                        <strong id="signal-pair"></strong>
                    </div>
                    <div class="signal-row">
                        <span>Expiry</span>
                        <strong id="signal-time"></strong>
                    </div>
                    <div class="signal-row direction">
                        <span>Signal</span>
                        <strong id="signal-direction"></strong>
                    </div>
                </div>
            </div>
        </div>

    </div>

    <!-- Hidden SVG for gradient definition -->
    <svg width="0" height="0" style="position:absolute">
        <defs>
            <linearGradient id="winrateGradient" x1="0%" y1="0%" x2="100%" y2="0%">
                <stop offset="0%"   stop-color="#00ff41"/>
                <stop offset="100%" stop-color="#f5c842"/>
            </linearGradient>
        </defs>
    </svg>

    <script src="script.js"></script>

    <!-- Winrate Circle Animation -->
    <script>
        const TARGET = 90; // percentage
        const circumference = 314; // 2 * π * 50

        function animateWinrate() {
            const fill   = document.getElementById('winrate-fill');
            const numEl  = document.getElementById('winrate-num');
            if (!fill || !numEl) return;

            // Animate SVG stroke
            const offset = circumference - (TARGET / 100) * circumference;
            setTimeout(() => {
                fill.style.strokeDashoffset = offset;
            }, 300);

            // Count-up number
            let current = 0;
            const step  = TARGET / 60;
            const timer = setInterval(() => {
                current += step;
                if (current >= TARGET) { current = TARGET; clearInterval(timer); }
                numEl.textContent = Math.round(current) + '%';
            }, 33);
        }

        // Run on page load
        window.addEventListener('DOMContentLoaded', () => {
            setTimeout(animateWinrate, 400);
        });
    </script>

    <!-- Matrix Rain -->
    <script>
        const canvas = document.getElementById('matrix-canvas');
        const ctx = canvas.getContext('2d');

        function resize() {
            canvas.width  = window.innerWidth;
            canvas.height = window.innerHeight;
        }
        resize();

        const fontSize = 13;
        let cols = Math.floor(canvas.width / fontSize);
        let drops = Array(cols).fill(1);
        const chars = '01';

        let animId;
        function drawMatrix() {
            ctx.fillStyle = 'rgba(0,0,0,0.055)';
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            for (let i = 0; i < drops.length; i++) {
                const char = chars[Math.floor(Math.random() * chars.length)];
                const x = i * fontSize;
                const y = drops[i] * fontSize;

                ctx.fillStyle = Math.random() > 0.96 ? '#ffffff' : '#00ff41';
                ctx.font = `${fontSize}px 'Courier New', monospace`;
                ctx.fillText(char, x, y);

                if (y > canvas.height && Math.random() > 0.975) drops[i] = 0;
                drops[i]++;
            }
        }

        function startMatrix() { animId = setInterval(drawMatrix, 45); }
        startMatrix();

        window.addEventListener('resize', () => {
            clearInterval(animId);
            resize();
            cols = Math.floor(canvas.width / fontSize);
            drops = Array(cols).fill(1);
            startMatrix();
        });

        if (window.matchMedia('(prefers-reduced-motion: reduce)').matches) {
            clearInterval(animId);
            ctx.fillStyle = '#000';
            ctx.fillRect(0, 0, canvas.width, canvas.height);
        }
    </script>
</body>
</html>
